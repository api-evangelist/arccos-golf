  composite_keys:
  - entity: Course
    key:
    - courseId
    - courseVersion
    note: >-
      A course is versioned. Rounds pin both courseId and courseVersion so historical rounds keep the geometry
      they were played against.
  user_id_source: >-
    The {userId} path parameter is the custom:arccosUserId claim from the OIDC id_token, not a value the client
    chooses.
