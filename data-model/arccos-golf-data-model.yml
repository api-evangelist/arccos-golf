summary: >-
  The Arccos on-course data graph. A User plays Rounds; a Round is played at a versioned Course and is composed
  of RoundHoles, each carrying the Course's Hole geometry, a Pin location, HoleStats and the Shots played. Each
  Shot names the Club it was hit with. Round stats are computed separately as a Strokes Gained + traditional
  breakdown keyed to a goalHandicap. Webhooks are a small independent registration entity.
