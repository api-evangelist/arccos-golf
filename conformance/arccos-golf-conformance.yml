gaps:
- No security.txt and no published vulnerability-disclosure or bug-bounty program.
- No published certifications or trust center.
- No RFC 9457 error format and no documented error-code registry.
- No rate-limit policy or headers on the data API.
- Webhook payloads are unsigned.
- No HSTS on the API host; DNSSEC not enabled; no CAA records; DMARC at p=none only.
