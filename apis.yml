apis:
- name: Arccos On-Course Data API
  description: >-
    Restricted-access REST API that exposes the on-course data powering the Arccos apps — a golfer's rounds,
    per-round traditional and Strokes Gained stats, paired clubs and smart club distances, user profile, and a
    course catalog with versioned hole/tee geometry. Read access is granted per scope via an OAuth 2.0
    authorization-code flow against signin.arccosgolf.com; clients also register HTTPS webhooks (Basic auth) to
    receive postRound, patchRound, deleteRound and accountDisconnected events. The course search and
    course-lookup operations are callable anonymously.
  humanURL: https://api.arccosgolf.com/swagger
  baseURL: https://api.arccosgolf.com/
