- name: Arccos Golf Storefront UCP MCP Server
  description: >-
    Universal Commerce Protocol (UCP) MCP endpoint published on the Arccos Golf Shopify storefront for
    agent-driven commerce. An anonymous JSON-RPC tools/list returns 13 tools covering catalog search and lookup,
    product detail, cart create/update/cancel, checkout create/get/update/complete/cancel and order lookup, each
    with a full JSON Schema inputSchema. Discovery is at /.well-known/ucp; agent instructions are published at
    /llms.txt and /agents.md. This is the Shopify platform commerce surface, not the Arccos golf-data API.
  humanURL: https://www.arccosgolf.com/llms.txt
  baseURL: https://www.arccosgolf.com/api/ucp/mcp
