aid: arccos-golf
name: Arccos Golf
description: >-
  Arccos Golf is the golf performance-tracking platform behind the Arccos Caddie smart sensors, smart grips and
  the Arccos Air wearable — the Official Game Tracker of the PGA TOUR. Club-mounted sensors and the Arccos mobile
  app automatically capture every shot on the course, then AI-driven Strokes Gained analytics, Smart Club
  Distances, an AI rangefinder and Arccos Caddie strategy turn that shot data into per-round and per-hole
  insight. Arccos exposes that same data to approved third parties through the Arccos On-Course Data API, a
  Swagger 2.0-documented REST API over rounds, round stats, clubs, users and a public course/course-version
  catalog, secured with an OAuth 2.0 authorization-code flow and per-resource read scopes, plus registerable
  HTTPS webhooks for round and account-disconnect events. Its Shopify-hosted storefront additionally publishes
  an llms.txt and a Universal Commerce Protocol (UCP) MCP endpoint for agent-driven commerce.
