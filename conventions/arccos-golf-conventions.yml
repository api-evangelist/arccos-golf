  content_type: application/json
  shape: '{"error":{"code":<int>,"description":<string>}}'
  observed: '{"error":{"code":40101,"description":"No Authorization header passed."}} — HTTP 401'
  note: >-
    The code is a numeric compound of the HTTP status and an internal ordinal (40101 = 401 / 01). No error
    responses are declared in the Swagger document — every operation documents only a 200.
  see: errors/arccos-golf-problem-types.yml
rate_limiting:
  documented: false
  headers_observed: none
  note: >-
    No rate-limit policy is published for the On-Course Data API and no X-RateLimit-*/RateLimit-* headers appear
    on responses. The storefront llms.txt does state that the UCP MCP endpoint is rate-limited per IP with 429
    back-off, but that is the Shopify commerce surface, not this API.
content_types:
  responses: application/json
  token_endpoint_request: application/x-www-form-urlencoded
data_conventions:
  timestamps: ISO 8601 UTC (e.g. 2026-05-28T18:42:13.123Z in the accountDisconnected payload)
  distances: metric — shotDistance, altitude and metersToCenterOfGreen fields are metres
  geo: decimal latitude/longitude on the Location object
  course_identity: >-
    Courses are identified by the pair (courseId, courseVersion); a course version pins the hole and tee geometry
    a round was played against.
