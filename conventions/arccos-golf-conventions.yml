summary: >-
  Cross-cutting request/response semantics for the Arccos On-Course Data API, taken from the published Swagger
  document and from responses observed on the anonymous course-catalog endpoints. Request-level idempotency keys
  are NOT offered; idempotency in this API is a webhook-delivery contract keyed on eventId.
authentication:
  styles:
  - oauth2_authorization_code
  - http_basic
  bearer_header: 'Authorization: Bearer {access_token}'
  challenge_header: 'WWW-Authenticate: Bearer realm="arccos"'
  see: authentication/arccos-golf-authentication.yml
versioning:
  style: path
  current: v5
  example: https://api.arccosgolf.com/v5/courses
  policy: >-
    Published statement — "This is a living project. While backward compatibility will be preserved, updates will
    be regular." No dated version header, no Sunset/Deprecation (RFC 8594) headers observed.
  see: lifecycle/arccos-golf-lifecycle.yml
pagination:
  style: limit-offset
  params:
  - name: limit
    in: query
    type: integer
    description: maximum number of results to get
  - name: offset
    in: query
    type: integer
    description: number of results to get per request (as documented in the spec)
  response_envelope:
    schema: PagedResponseHelper
    fields:
    - results
    - paging
    paging_fields:
    - limit
    - offset
  observed: '{"results":[],"paging":{"limit":1,"offset":0}} — GET /v5/courses?limit=1, 2026-08-06'
  default_limit: 10
  applies_to:
  - handle_search_rounds.get./v5/users/{userId}/rounds
  - handle_search_courses.get./v5/courses
  - handle_search_clubs.get./v5/users/{userId}/clubs
  no_cursor: true
  no_total_count: The paging object carries limit and offset only; no total or next-page cursor is returned.
filtering:
- operation: handle_search_courses.get./v5/courses
  params:
  - name: name
    note: partial course-name match
- operation: handle_search_clubs.get./v5/users/{userId}/clubs
