    note: -30 to 10; shapes the goal column of the returned traditional stats
field_expansion:
  supported: false
  note: No sparse-fieldset, expand or field-selection parameter is published; responses are fixed shapes.
metadata:
  supported: false
idempotency:
  request_level:
    supported: false
    note: >-
      No Idempotency-Key header is published, and the only non-GET operations (webhook create/delete) are
      naturally scoped by the webhookUrl / webhookId they carry.
  webhook_delivery:
    supported: true
    delivery_semantics: at-least-once
    idempotency_key: eventId
    retention: not published
    published_rules:
    - eventId is the idempotency key for a published webhook event and remains stable across delivery retries.
    - Consumers must dedupe by eventId.
    - >-
      Retries fan out per SQS message — if a client registers multiple webhook URLs and one fails, healthy URLs
      can receive duplicate POSTs carrying the same eventId.
    - >-
      Repeated disconnect actions can produce a NEW event for the same account, so cleanup should additionally be
      made idempotent by (userId, clientId).
    - Ordering between webhook event types is not guaranteed.
    - Respond 2xx after durable receipt and do downstream cleanup asynchronously.
    source: https://api.arccosgolf.com/swagger.json — "Webhooks" section of info.description
    see: asyncapi/arccos-golf-webhooks.yml
request_tracing:
  header: apigw-requestid
  note: >-
    Every response carries an AWS API Gateway request id plus CloudFront x-amz-cf-id headers. Neither is
    documented as a support correlation id, but both are observable on every call.
  observed: '2026-08-06'
