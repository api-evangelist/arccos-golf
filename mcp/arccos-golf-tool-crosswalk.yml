headline: >-
  Arccos Golf's two machine surfaces do not overlap at all. The MCP server is the Shopify UCP commerce endpoint
  on the storefront host; the OpenAPI is the On-Course Data API on the API host. Zero of the 13 MCP tools bind to
  any of the 12 REST operations, and none of the REST operations is exposed to agents through MCP. Recorded here
  because that divergence is the finding — an agent that discovers Arccos through /llms.txt can buy a sensor but
  cannot read a single round, club or course.
